<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#333">
<script>
const TAU=Math.PI*2;
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function tri(c,a,b,d,e,f,g){c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.lineTo(f,g);c.closePath();c.fill();}
const FONT='"Arial Black","Arial Bold",Arial,sans-serif';

function scene(c){
  // dusk sky like the game
  const g=c.createLinearGradient(0,0,0,512); g.addColorStop(0,'#0a1433'); g.addColorStop(.45,'#1d2a6b'); g.addColorStop(.7,'#823a6c'); g.addColorStop(.85,'#e2574c'); g.addColorStop(1,'#f59a5a');
  c.fillStyle=g; c.fillRect(0,0,512,512);
  c.fillStyle='rgba(255,255,255,.85)'; for(const [x,y] of [[70,150],[440,140],[400,60],[120,40],[470,230],[40,250]]) c.fillRect(x,y,4,4);
  // cathedral with its tall iron spire (right)
  c.fillStyle='#2a2b62';
  c.fillRect(350,250,120,120); tri(c,356,250,410,250,383,215); tri(c,410,250,470,250,440,220);
  tri(c,392,250,428,250,410,40); c.fillRect(396,200,28,50);
  c.strokeStyle='#454a93'; c.lineWidth=2; for(let y=90;y<240;y+=16){ const hw=(y-40)/210*18; c.beginPath(); c.moveTo(410-hw,y); c.lineTo(410+hw,y); c.stroke(); }
  // Gros-Horloge: arch building with the golden one-hand clock (left)
  c.fillStyle='#d9ccad'; c.fillRect(40,205,150,165); c.fillStyle='#3b4458'; c.beginPath(); c.moveTo(32,205); c.lineTo(115,150); c.lineTo(198,205); c.fill();
  c.fillStyle='#8a7d62'; c.beginPath(); c.moveTo(80,370); c.lineTo(80,320); c.arc(115,320,35,Math.PI,0); c.lineTo(150,370); c.fill();
  const cx=115, cy=258;
  c.fillStyle='#e7b53a'; c.beginPath(); c.arc(cx,cy,46,0,TAU); c.fill();
  c.fillStyle='#2848a0'; c.beginPath(); c.arc(cx,cy,37,0,TAU); c.fill();
  c.fillStyle='#e7b53a'; for(let i=0;i<16;i++){ const a=i/16*TAU; c.beginPath(); c.moveTo(cx+Math.cos(a-.09)*11,cy+Math.sin(a-.09)*11); c.lineTo(cx+Math.cos(a)*33,cy+Math.sin(a)*33); c.lineTo(cx+Math.cos(a+.09)*11,cy+Math.sin(a+.09)*11); c.fill(); }
  c.fillStyle='#ffd964'; c.beginPath(); c.arc(cx,cy,10,0,TAU); c.fill();
  c.strokeStyle='#ffd964'; c.lineWidth=5; c.lineCap='round'; c.beginPath(); c.moveTo(cx,cy); c.lineTo(cx+22,cy-22); c.stroke();
  // front row of colourful half-timbered houses
  const pals=[['#e8846a','#3b2418'],['#7fc8c0','#2c3e66'],['#efe6d6','#5a2e1a'],['#ef9fb5','#4a2a4a'],['#a8d58a','#3d2a17'],['#9fb8ec','#2a2f5a']];
  let x=-6,i=0;
  while(x<512){ const w=66+((i*37)%24), top=330+((i*23)%22), [wall,tim]=pals[i%pals.length];
    c.fillStyle=wall; c.fillRect(x,top,w,200);
    c.fillStyle='#46526b'; tri(c,x-3,top+1,x+w+3,top+1,x+w/2,top-42);
    c.fillStyle=tim; c.fillRect(x,top,w,5); c.fillRect(x,top+44,w,5); c.fillRect(x,top,5,200); c.fillRect(x+w-5,top,5,200);
    c.strokeStyle=tim; c.lineWidth=4; c.beginPath(); c.moveTo(x+4,top+5); c.lineTo(x+w-4,top+44); c.moveTo(x+w-4,top+5); c.lineTo(x+4,top+44); c.stroke();
    c.fillStyle='#ffd27a'; c.fillRect(x+w/2-10,top+60,20,24); c.fillStyle=tim; c.fillRect(x+w/2-1,top+60,2,24);
    x+=w; i++; }
}
function crown(c,hx,hy,s){ // hy = top of the head
  c.save(); c.translate(hx,hy); c.scale(s,s);
  c.fillStyle='#b3001b'; c.beginPath(); c.ellipse(0,-6,9,9,0,Math.PI,0); c.fill();
  const g=c.createLinearGradient(0,-20,0,2); g.addColorStop(0,'#fff3a6'); g.addColorStop(.5,'#ffc800'); g.addColorStop(1,'#c98a00');
  c.strokeStyle=g; c.lineWidth=2; c.beginPath(); c.moveTo(-8.5,-5); c.quadraticCurveTo(-6,-17,0,-16); c.quadraticCurveTo(6,-17,8.5,-5); c.moveTo(0,-16); c.lineTo(0,-6); c.stroke();
  c.fillStyle=g; c.beginPath(); c.arc(0,-18.5,2.4,0,TAU); c.fill(); c.fillRect(-.9,-25.5,1.8,6); c.fillRect(-2.6,-23.5,5.2,1.8);
  c.beginPath(); c.moveTo(-10,1); c.lineTo(-10,-5); c.lineTo(-7.5,-9); c.lineTo(-5,-5); c.lineTo(-2.5,-10); c.lineTo(0,-6); c.lineTo(2.5,-10); c.lineTo(5,-5); c.lineTo(7.5,-9); c.lineTo(10,-5); c.lineTo(10,1); c.closePath(); c.fill();
  c.strokeStyle='#8a5c00'; c.lineWidth=.8; c.stroke();
  c.fillStyle='#e0001b'; c.beginPath(); c.arc(0,-2,1.9,0,TAU); c.fill();
  c.fillStyle='#1f5fd6'; c.beginPath(); c.arc(-5.5,-2,1.4,0,TAU); c.arc(5.5,-2,1.4,0,TAU); c.fill();
  c.restore();
}
function abelFront(c,cx,feet,s){ // Abel facing us, arms up in victory
  c.save(); c.translate(cx,feet); c.scale(s,s); c.lineCap='round'; c.lineJoin='round';
  const SKIN='#f4cfab', HAIR='#f5d977', HAIRS='#d4a93f';
  // baggy grey-blue pants and white sneakers
  c.fillStyle='#6f87a8'; c.beginPath(); c.moveTo(-15,-40); c.lineTo(15,-40); c.lineTo(19,-4); c.lineTo(3,-4); c.lineTo(0,-24); c.lineTo(-3,-4); c.lineTo(-19,-4); c.closePath(); c.fill();
  c.strokeStyle='#566e8f'; c.lineWidth=1.3; c.beginPath(); c.moveTo(-10,-30); c.lineTo(-11,-8); c.moveTo(10,-30); c.lineTo(11,-8); c.stroke();
  c.fillStyle='#fbfbfb'; rr(c,-22,-6,17,7,3.5); c.fill(); rr(c,5,-6,17,7,3.5); c.fill();
  c.fillStyle='#c3cad6'; c.fillRect(-22,-1,17,2); c.fillRect(5,-1,17,2);
  // arms up (behind the shirt at the shoulders)
  c.strokeStyle=SKIN; c.lineWidth=5.5;
  c.beginPath(); c.moveTo(-13,-66); c.lineTo(-24,-80); c.lineTo(-27,-96); c.stroke();
  c.beginPath(); c.moveTo(13,-66); c.lineTo(24,-80); c.lineTo(27,-96); c.stroke();
  c.fillStyle=SKIN; c.beginPath(); c.arc(-27,-98,3.6,0,TAU); c.arc(27,-98,3.6,0,TAU); c.fill();
  // oversized PSG shirt: navy with the wide red band edged in white
  c.fillStyle='#0e1f5c'; c.beginPath(); c.moveTo(-15,-70); c.lineTo(15,-70); c.lineTo(24,-62); c.lineTo(19,-55); c.lineTo(17,-58); c.lineTo(18,-36); c.lineTo(-18,-36); c.lineTo(-17,-58); c.lineTo(-19,-55); c.lineTo(-24,-62); c.closePath(); c.fill();
  c.save(); c.clip(); c.fillStyle='#fff'; c.fillRect(-8,-72,16,40); c.fillStyle='#e0393e'; c.fillRect(-5.5,-72,11,40); c.restore();
  c.fillStyle='#fff'; c.beginPath(); c.moveTo(-5,-70); c.lineTo(0,-65); c.lineTo(5,-70); c.fill();
  c.fillStyle='#fff'; c.beginPath(); c.arc(11,-62,2.4,0,TAU); c.fill(); c.fillStyle='#0e1f5c'; c.beginPath(); c.arc(11,-62,1.7,0,TAU); c.fill();
  // head
  c.fillStyle=SKIN; c.fillRect(-3.5,-74,7,6);
  c.beginPath(); c.ellipse(0,-86,12,13,0,0,TAU); c.fill();
  c.beginPath(); c.arc(-12,-85,2.8,0,TAU); c.arc(12,-85,2.8,0,TAU); c.fill();
  c.fillStyle='#1d2a44'; c.beginPath(); c.ellipse(-4.6,-86,1.9,2.5,0,0,TAU); c.ellipse(4.6,-86,1.9,2.5,0,0,TAU); c.fill();
  c.fillStyle='#fff'; c.beginPath(); c.arc(-4,-87,.7,0,TAU); c.arc(5.2,-87,.7,0,TAU); c.fill();
  c.fillStyle='rgba(230,120,110,.45)'; c.beginPath(); c.arc(-7.5,-81.5,2.4,0,TAU); c.arc(7.5,-81.5,2.4,0,TAU); c.fill();
  c.strokeStyle='#b0665a'; c.lineWidth=1.4; c.beginPath(); c.moveTo(-4.5,-79.5); c.quadraticCurveTo(0,-75.5,4.5,-79.5); c.stroke();
  // blond messy hair with a fringe
  c.fillStyle=HAIR; c.beginPath();
  c.moveTo(-12.5,-86); c.quadraticCurveTo(-14,-97,-8,-100); c.lineTo(-10,-104); c.lineTo(-4,-101); c.lineTo(-2,-106); c.lineTo(2,-101); c.lineTo(6,-105); c.lineTo(7,-100); c.lineTo(12,-102); c.quadraticCurveTo(14.5,-95,12.5,-86);
  c.lineTo(10,-92); c.lineTo(7,-89); c.lineTo(4,-93); c.lineTo(1,-89); c.lineTo(-2,-93); c.lineTo(-5,-89); c.lineTo(-8,-93); c.lineTo(-10,-89); c.closePath(); c.fill();
  c.strokeStyle=HAIRS; c.lineWidth=1; c.beginPath(); c.moveTo(-6,-98); c.lineTo(-3,-94); c.moveTo(3,-99); c.lineTo(5,-94); c.stroke();
  crown(c,0,-101,1.15);
  c.restore();
}
function title(c,scale){ // same look as the menu: white line with a red shadow, gold second line
  c.save(); c.translate(256,256); c.scale(scale,scale); c.translate(-256,-256); c.textAlign='center'; c.lineJoin='round';
  const line=(txt,y,max,col)=>{ c.font='bold 10px "DejaVu Sans",'+FONT; const sz=Math.min(54,10*max/c.measureText(txt).width); c.font='bold '+sz+'px "DejaVu Sans",'+FONT;
    c.lineWidth=sz*.3; c.strokeStyle='#0a1128'; c.strokeText(txt,256,y+sz*.12); c.fillStyle='#e0393e'; c.fillText(txt,256,y+sz*.12);
    c.lineWidth=sz*.22; c.strokeText(txt,256,y); c.fillStyle=col; c.fillText(txt,256,y); };
  line('ABEL LE MEILLEUR',96,470,'#ffffff');
  c.fillStyle='rgba(8,16,42,.78)'; rr(c,24,424,464,62,18); c.fill();
  line('PARKOUR À ROUEN',470,440,'#ffcd3c');
  c.restore();
}
function draw(c,N,safe){ // safe: shrink the artwork so a circle crop keeps everything
  c.save(); c.scale(N/512,N/512);
  scene(c);
  c.save(); if(safe){ c.translate(256,256); c.scale(.78,.78); c.translate(-256,-256); }
  abelFront(c,256,420,2.05);
  c.restore();
  title(c,safe?.74:1);
  c.restore();
}
window.render=(N,safe)=>{ const cv=document.createElement('canvas'); cv.width=cv.height=N; draw(cv.getContext('2d'),N,safe); return cv.toDataURL('image/png'); };
</script></body></html>
