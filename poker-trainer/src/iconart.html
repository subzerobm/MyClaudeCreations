<!doctype html>
<!-- Logo for "Table du Vendredi": art deco, black and gold, gangster + poker face.
     The "poker face" is an Ace of spades wearing a fedora, cigar in the corner of its "mouth".
     Open with #full (edge to edge) or #safe (artwork at 80% so round icon masks never crop it).
     Rendered to PNG with a headless browser at 1024x1024. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:wght@400;500&display=swap">
<style>
  html, body { margin: 0; background: #0b0b0d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
const S = 1024;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const SAFE = location.hash === '#safe';
const DISPLAY = 'Italiana, "Didot", "Bodoni 72", Georgia, serif';
const SERIF = '"Cormorant Garamond", Garamond, Georgia, serif';

const C = {
  black: '#0b0b0d', suit: '#141418', ivory: '#f6f1e4', ink: '#141416', red: '#8e1b25', heart: '#b3202c',
  gold1: '#f3dc9a', gold2: '#d4af37', gold3: '#8a6a1f',
};
function goldGrad(y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, C.gold1); gr.addColorStop(0.5, C.gold2); gr.addColorStop(1, C.gold3);
  return gr;
}

/* ---------- layer 1: pinstripe suit background ---------- */
function background() {
  g.fillStyle = C.black; g.fillRect(0, 0, S, S);
  const glow = g.createRadialGradient(512, 560, 30, 512, 560, 560);
  glow.addColorStop(0, 'rgba(60, 48, 30, 0.75)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = glow; g.fillRect(0, 0, S, S);
  g.strokeStyle = 'rgba(255, 255, 255, 0.045)'; g.lineWidth = 2;
  for (let x = 11; x < S; x += 24) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, S); g.stroke(); }
  const v = g.createRadialGradient(512, 512, 360, 512, 512, 760);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.7)');
  g.fillStyle = v; g.fillRect(0, 0, S, S);
}

/* ---------- layer 2: art deco frame and sunburst ---------- */
function frame() {
  g.strokeStyle = goldGrad(0, S);
  g.lineWidth = 3; g.strokeRect(40, 40, S - 80, S - 80);
  g.lineWidth = 1.5; g.strokeRect(56, 56, S - 112, S - 112);
  // corner fans
  [[56, 56, 0], [S - 56, 56, Math.PI / 2], [S - 56, S - 56, Math.PI], [56, S - 56, Math.PI * 1.5]].forEach(([x, y, a]) => {
    g.save(); g.translate(x, y); g.rotate(a);
    g.strokeStyle = C.gold2; g.lineWidth = 1.5;
    for (let r = 26; r <= 70; r += 22) { g.beginPath(); g.arc(0, 0, r, 0, Math.PI / 2); g.stroke(); }
    for (let k = 1; k < 5; k++) { const t = k * Math.PI / 10; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(t) * 70, Math.sin(t) * 70); g.stroke(); }
    g.restore();
  });
}
function sunburst(cx, cy) {
  g.save(); g.translate(cx, cy);
  for (let i = 0; i < 48; i++) {
    const a = i * Math.PI * 2 / 48;
    g.fillStyle = i % 2 ? 'rgba(212, 175, 55, 0.07)' : 'rgba(212, 175, 55, 0.02)';
    g.beginPath(); g.moveTo(0, 0);
    g.arc(0, 0, 430, a, a + Math.PI * 2 / 48); g.closePath(); g.fill();
  }
  g.strokeStyle = 'rgba(212, 175, 55, 0.35)'; g.lineWidth = 1.5;
  g.beginPath(); g.arc(0, 0, 300, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(0, 0, 312, 0, Math.PI * 2); g.stroke();
  g.restore();
}

/* ---------- layer 3: the cards ---------- */
function roundRect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function card(x, y, rot, rank, suit, color, w = 270, h = 380, big = true) {
  g.save(); g.translate(x, y); g.rotate(rot);
  g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 30; g.shadowOffsetY = 14;
  g.fillStyle = C.ivory; roundRect(-w / 2, -h / 2, w, h, 18); g.fill();
  g.shadowColor = 'transparent';
  g.strokeStyle = C.gold2; g.lineWidth = 2; roundRect(-w / 2 + 12, -h / 2 + 12, w - 24, h - 24, 10); g.stroke();
  g.fillStyle = color; g.textAlign = 'center';
  g.font = `500 54px ${SERIF}`; g.fillText(rank, -w / 2 + 40, -h / 2 + 66);
  g.font = '40px Georgia, serif'; g.fillText(suit, -w / 2 + 40, -h / 2 + 108);
  // same index upside down in the bottom-right corner, like real cards
  g.save(); g.rotate(Math.PI);
  g.font = `500 54px ${SERIF}`; g.fillText(rank, -w / 2 + 40, -h / 2 + 66);
  g.font = '40px Georgia, serif'; g.fillText(suit, -w / 2 + 40, -h / 2 + 108);
  g.restore();
  if (big){ g.font = '190px Georgia, serif'; g.fillText(suit, 0, 70); }
  g.restore();
}

/* ---------- layer 4: fedora on the ace ---------- */
function fedora(x, y, rot) {
  g.save(); g.translate(x, y); g.rotate(rot);
  const crown = () => {
    g.beginPath(); g.moveTo(-112, 0);
    g.bezierCurveTo(-122, -80, -108, -150, -62, -160);
    g.quadraticCurveTo(0, -128, 62, -160);
    g.bezierCurveTo(108, -150, 122, -80, 112, 0); g.closePath();
  };
  // brim shadow on the card
  g.save(); g.filter = 'blur(14px)'; g.fillStyle = 'rgba(0,0,0,0.55)';
  g.beginPath(); g.ellipse(4, 22, 168, 26, 0, 0, Math.PI * 2); g.fill(); g.restore();
  // crown
  const cg = g.createLinearGradient(-120, 0, 120, 0);
  cg.addColorStop(0, '#2c2c31'); cg.addColorStop(0.45, '#17171a'); cg.addColorStop(1, '#0a0a0b');
  crown(); g.fillStyle = cg; g.fill();
  // red band
  g.save(); crown(); g.clip();
  g.fillStyle = C.red; g.fillRect(-140, -46, 280, 36);
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(-140, -14, 280, 4);
  g.restore();
  // crown light edge and pinch
  g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-100, -20); g.bezierCurveTo(-108, -80, -98, -138, -62, -150); g.stroke();
  g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(-20, -142); g.quadraticCurveTo(0, -110, 10, -60); g.stroke();
  // brim
  const bg = g.createLinearGradient(0, -20, 0, 30);
  bg.addColorStop(0, '#2a2a2f'); bg.addColorStop(1, '#08080a');
  g.fillStyle = bg;
  g.beginPath(); g.moveTo(-172, 4);
  g.bezierCurveTo(-160, -24, 160, -24, 172, 4);
  g.bezierCurveTo(160, 30, -160, 30, -172, 4); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(212,175,55,0.55)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-168, 2); g.bezierCurveTo(-156, -20, 156, -20, 168, 2); g.stroke();
  g.restore();
}

/* ---------- layer 5: cigar with smoke ---------- */
function cigar(x, y, rot) {
  g.save(); g.translate(x, y); g.rotate(rot);
  const L = 210, T = 24;
  const body = g.createLinearGradient(0, -T / 2, 0, T / 2);
  body.addColorStop(0, '#8a5a34'); body.addColorStop(0.5, '#5e3a1f'); body.addColorStop(1, '#3a2312');
  g.fillStyle = body; roundRect(0, -T / 2, L, T, 11); g.fill();
  g.fillStyle = goldGrad(-T / 2, T / 2); g.fillRect(34, -T / 2, 26, T);
  g.fillStyle = C.red; g.fillRect(40, -T / 2 + 6, 14, T - 12);
  g.fillStyle = '#9a9690'; g.fillRect(L - 26, -T / 2, 20, T);
  const ember = g.createRadialGradient(L - 4, 0, 1, L - 4, 0, 18);
  ember.addColorStop(0, '#ffd27a'); ember.addColorStop(0.5, '#ff6a1a'); ember.addColorStop(1, 'rgba(255,80,20,0)');
  g.fillStyle = ember; g.beginPath(); g.arc(L - 4, 0, 18, 0, Math.PI * 2); g.fill();
  g.restore();
  // smoke curling up from the tip
  const tipX = x + Math.cos(rot) * 210, tipY = y + Math.sin(rot) * 210;
  g.strokeStyle = 'rgba(240, 236, 228, 0.45)'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(tipX, tipY - 8);
  g.bezierCurveTo(tipX + 40, tipY - 70, tipX - 30, tipY - 120, tipX + 10, tipY - 180);
  g.bezierCurveTo(tipX + 40, tipY - 220, tipX + 10, tipY - 260, tipX + 30, tipY - 300); g.stroke();
  g.strokeStyle = 'rgba(240, 236, 228, 0.25)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(tipX + 6, tipY - 20);
  g.bezierCurveTo(tipX + 60, tipY - 80, tipX + 10, tipY - 150, tipX + 50, tipY - 210); g.stroke();
}

/* ---------- layer 6: champagne flute in gold line ---------- */
function flute(x, y, rot, s) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  const bowl = () => {
    g.beginPath(); g.moveTo(-8, -112);
    g.bezierCurveTo(-28, -130, -36, -200, -34, -320); g.lineTo(34, -320);
    g.bezierCurveTo(36, -200, 28, -130, 8, -112); g.closePath();
  };
  g.save(); bowl(); g.clip();
  const liq = g.createLinearGradient(0, -280, 0, -110);
  liq.addColorStop(0, 'rgba(243, 220, 154, 0.85)'); liq.addColorStop(1, 'rgba(212, 175, 55, 0.85)');
  g.fillStyle = liq; g.fillRect(-40, -280, 80, 170);
  g.fillStyle = 'rgba(255,255,255,0.85)';
  [[-10, -150, 3], [8, -180, 2.5], [-4, -215, 2.5], [10, -240, 3], [-12, -258, 2]].forEach(([bx, by, r]) => { g.beginPath(); g.arc(bx, by, r, 0, Math.PI * 2); g.fill(); });
  g.restore();
  g.strokeStyle = goldGrad(-320, 0); g.lineWidth = 3.5;
  bowl(); g.stroke();
  g.beginPath(); g.ellipse(0, -320, 34, 7, 0, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(0, -112); g.lineTo(0, 0); g.stroke();
  g.beginPath(); g.ellipse(0, 0, 44, 10, 0, 0, Math.PI * 2); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.45)'; g.lineWidth = 4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-20, -290); g.bezierCurveTo(-24, -220, -20, -170, -12, -140); g.stroke();
  g.restore();
}

/* ---------- layer 7: chip stacks in black, red and ivory ---------- */
const CHIP = {
  black: {face: '#1b1b1f', side: '#0c0c0e', edge: '#d4af37'},
  red:   {face: '#8e1b25', side: '#5a0f17', edge: '#f6f1e4'},
  ivory: {face: '#efe7d2', side: '#b9ad8e', edge: '#8e1b25'},
};
function chip(x, y, c) {
  const rx = 46, ry = 15, h = 12;
  // side
  g.fillStyle = c.side;
  g.beginPath(); g.ellipse(x, y + h, rx, ry, 0, 0, Math.PI);
  g.lineTo(x - rx, y); g.ellipse(x, y, rx, ry, 0, Math.PI, 0, true); g.closePath(); g.fill();
  g.fillStyle = c.edge;
  for (let k = -2; k <= 2; k++) {
    const sx = x + k * 19;
    g.fillRect(sx - 3, y + ry * Math.sqrt(Math.max(0, 1 - ((sx - x) / rx) ** 2)) - 1, 6, h);
  }
  // face with dashed edge inlay and a thin gold ring
  g.fillStyle = c.face;
  g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = c.edge; g.lineWidth = 5; g.setLineDash([12, 11]);
  g.beginPath(); g.ellipse(x, y, rx - 5, ry - 2, 0, 0, Math.PI * 2); g.stroke();
  g.setLineDash([]);
  g.strokeStyle = C.gold2; g.lineWidth = 1.5;
  g.beginPath(); g.ellipse(x, y, rx - 17, ry - 6, 0, 0, Math.PI * 2); g.stroke();
}
function stack(x, y, colors) {
  g.save(); g.filter = 'blur(6px)'; g.fillStyle = 'rgba(0,0,0,0.6)';
  g.beginPath(); g.ellipse(x + 6, y + 16, 54, 18, 0, 0, Math.PI * 2); g.fill(); g.restore();
  colors.forEach((c, i) => chip(x + (i % 2 ? 1.5 : -1.5), y - i * 12, CHIP[c]));
}
function chipStacks() {
  // all chips grouped on the right, clear of the Ace and the bottom lettering
  stack(648, 872, ['red', 'ivory', 'red', 'ivory']);
  stack(728, 862, ['ivory', 'red', 'ivory', 'ivory', 'ivory']);
  stack(806, 850, ['black', 'black', 'red', 'black', 'red', 'black', 'black', 'black']);
  stack(886, 868, ['red', 'red', 'black', 'red', 'red']);}

/* ---------- ashtray (art deco glass with a gold rim) ---------- */
function ashtray(x, y) {
  const rx = 128, ry = 40, depth = 30;
  g.save(); g.filter = 'blur(10px)'; g.fillStyle = 'rgba(0,0,0,0.6)';
  g.beginPath(); g.ellipse(x + 8, y + depth + 10, rx + 6, ry, 0, 0, Math.PI * 2); g.fill(); g.restore();
  // body
  const side = g.createLinearGradient(x - rx, 0, x + rx, 0);
  side.addColorStop(0, '#2b2b30'); side.addColorStop(0.4, '#55555e'); side.addColorStop(1, '#1a1a1e');
  g.fillStyle = side;
  g.beginPath(); g.ellipse(x, y + depth, rx, ry, 0, 0, Math.PI);
  g.lineTo(x - rx, y); g.ellipse(x, y, rx, ry, 0, Math.PI, 0, true); g.closePath(); g.fill();
  // gold rim
  g.fillStyle = goldGrad(y - ry, y + ry);
  g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill();
  // bowl with ash
  const bowl = g.createRadialGradient(x - 20, y - 6, 4, x, y, rx);
  bowl.addColorStop(0, '#3a3a40'); bowl.addColorStop(1, '#101013');
  g.fillStyle = bowl;
  g.beginPath(); g.ellipse(x, y + 3, rx - 20, ry - 9, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(170, 166, 158, 0.55)';
  [[-30, 8, 9], [-14, 12, 6], [6, 6, 7], [-46, 4, 5]].forEach(([dx, dy, r]) => { g.beginPath(); g.ellipse(x + dx, y + dy, r * 1.6, r * 0.6, 0, 0, Math.PI * 2); g.fill(); });
  // notches in the rim where the cigar rests
  g.fillStyle = '#5a4512';
  g.beginPath(); g.ellipse(x + rx - 22, y + 14, 16, 6, -0.5, 0, Math.PI * 2); g.fill();
}

/* ---------- layer 8: lettering ---------- */
function spaced(text, cx, y, gap) {
  const ws = [...text].map(ch => g.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0) + gap * (text.length - 1);
  let x = cx - total / 2; g.textAlign = 'left';
  [...text].forEach((ch, i) => { g.fillText(ch, x, y); x += ws[i] + gap; });
  g.textAlign = 'center';
  return total;
}
function lettering() {
  g.fillStyle = C.gold1;
  g.font = `500 44px ${SERIF}`;
  const w = spaced('TABLE  DU', 512, 140, 16);
  g.strokeStyle = C.gold2; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(512 - w / 2 - 110, 126); g.lineTo(512 - w / 2 - 24, 126); g.stroke();
  g.beginPath(); g.moveTo(512 + w / 2 + 24, 126); g.lineTo(512 + w / 2 + 110, 126); g.stroke();
  g.font = `150px ${DISPLAY}`;
  g.fillStyle = goldGrad(130, 270);
  g.shadowColor = 'rgba(0,0,0,0.8)'; g.shadowBlur = 18; g.shadowOffsetY = 6;
  spaced('VENDREDI', 512, 268, 12);
  g.shadowColor = 'transparent';
  // "poker face" signature at the bottom, between two fine lines with a diamond
  g.font = `500 40px ${SERIF}`; g.fillStyle = C.gold1;
  const w2 = spaced('POKER  FACE', 512, 940, 14);
  g.strokeStyle = C.gold2; g.lineWidth = 1.5;
  [[-1], [1]].forEach(([d]) => {
    const x0 = 512 + d * (w2 / 2 + 22), x1 = 512 + d * (w2 / 2 + 110);
    g.beginPath(); g.moveTo(x0, 927); g.lineTo(x1, 927); g.stroke();
    g.save(); g.translate(x1 + d * 10, 927); g.rotate(Math.PI / 4); g.fillStyle = C.gold2; g.fillRect(-5, -5, 10, 10); g.restore();
  });
}

/* ---------- compose ---------- */
async function draw() {
  try { await Promise.all([document.fonts.load(`150px ${DISPLAY}`), document.fonts.load(`500 44px ${SERIF}`)]); } catch {}
  background();
  g.save();
  if (SAFE) { g.translate(512, 512); g.scale(0.8, 0.8); g.translate(-512, -512); }
  frame();
  sunburst(512, 600);
  // A Hold'em hand is two cards, read "A K": the Ace (the "face") on the left in front, the King behind on the right
  card(612, 618, 0.26, 'K', '♥', C.heart, 250, 352, true);
  card(478, 625, -0.08, 'A', '♠', C.ink);
  fedora(408, 432, -0.3); // perched on the Ace's top-left corner, cocked to the side like a gangster's hat
  // cigar resting in the ashtray: mouth end on the rim, lit end over the bowl
  ashtray(196, 828);
  cigar(340, 872, Math.atan2(-58, -186));
  chipStacks();
  lettering();
  g.restore();
  document.title = 'done';
}
draw();
</script>
</body>
</html>
