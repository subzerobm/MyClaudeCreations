<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #1a130d;
    --bg2: #120d09;
    --card: #241a12;
    --text: #f3ece2;
    --muted: #a89886;
    --accent: #b8860b;
    --accent-dark: #8f6a08;
    --border: #3a2c1f;
    --stroop-red: #ff6b6b;
    --stroop-blue: #6d9bff;
    --stroop-green: #4ade80;
    --stroop-yellow: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-weight: 400;
    background: radial-gradient(circle at 15% 0%, #2b1d12 0%, transparent 45%),
                radial-gradient(circle at 100% 20%, #241509 0%, transparent 50%),
                linear-gradient(160deg, var(--bg2) 0%, var(--bg) 45%, #241a12 100%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.16;
    z-index: 0;
    pointer-events: none;
  }
  body::before { width: 460px; height: 460px; top: -160px; left: -160px; background: var(--stroop-blue); }
  body::after { width: 480px; height: 480px; bottom: -180px; right: -160px; background: var(--accent); opacity: 0.14; }
  .page {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }
  .stroop-bar {
    height: 5px;
    margin: 0 -20px 28px;
    border-radius: 0 0 6px 6px;
    background: linear-gradient(90deg, var(--stroop-red), var(--stroop-yellow), var(--stroop-green), var(--stroop-blue));
  }
  .stroop-logo {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 36px;
    margin-bottom: 4px;
  }
  .stroop-logo #stroopWord {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .hero {
    text-align: center;
    margin-bottom: 24px;
  }
  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin-bottom: 6px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 15px;
    font-weight: 400;
  }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.2px; }
  h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 600;
    margin-top: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .facts {
    list-style: none;
    padding: 0;
    margin: 14px 0 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .facts li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
  }
  .icon-svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: var(--accent);
  }
  .icon-svg-muted { color: var(--muted); }
  .icon-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
  }
  .icon-circle .icon-svg { width: 28px; height: 28px; }
  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 14px 20px;
    border-radius: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    margin: 24px 0;
    box-shadow: 0 5px 0 var(--accent-dark), 0 8px 16px rgba(184,134,11,0.3);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--accent-dark), 0 10px 20px rgba(184,134,11,0.35); }
  .cta:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-dark), 0 4px 10px rgba(184,134,11,0.3); }
  .cta .icon-svg { color: #fff; width: 16px; height: 16px; }
  .home-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    background: var(--card);
    border: 1px solid var(--border);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .home-link:hover { color: var(--accent-dark); border-color: var(--accent); }
  .home-link .icon-svg { width: 15px; height: 15px; color: inherit; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 24px;
  }
  label {
    display: block;
    font-weight: 500;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .label-icon {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    color: var(--text);
  }
  label.checkbox {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-weight: 400;
  }
  label.checkbox input { margin-top: 3px; }
  input[type="text"], input[type="email"], select {
    display: block;
    width: 100%;
    margin-top: 0;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 400;
    font-family: inherit;
    background: var(--bg2);
    color: var(--text);
  }
  select option { background: var(--bg2); color: var(--text); }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  legend {
    font-weight: 600;
    font-size: 14px;
    padding: 0 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .small {
    font-size: 12.5px;
    color: var(--muted);
  }
  button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  button .icon-svg { color: #fff; width: 16px; height: 16px; }

  /* ===== Desktop layout ===== */
  @media (min-width: 860px) {
    .page { max-width: 920px; padding: 0 40px 80px; }
    .stroop-bar { margin: 0 -40px 40px; }
    .stroop-logo #stroopWord { font-size: 34px; }
    .hero h1 { font-size: 40px; }
    .subtitle { font-size: 17px; }

    .content-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
      align-items: start;
    }
    .content-grid .card:first-child { grid-row: span 2; }
    .facts { grid-template-columns: repeat(2, 1fr); }
    .cta { max-width: 360px; margin-left: auto; margin-right: auto; font-size: 17px; padding: 16px 28px; }
  }
</style>
