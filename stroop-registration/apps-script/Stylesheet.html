<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #6b6b6b;
    --accent: #1d4ed8;
    --accent-dark: #1739a6;
    --border: #e2e0da;
    --stroop-red: #e5484d;
    --stroop-blue: #2563eb;
    --stroop-green: #22a35d;
    --stroop-yellow: #eab308;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-weight: 400;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }
  .stroop-bar {
    height: 4px;
    margin: 0 -20px 28px;
    background: linear-gradient(90deg, var(--stroop-red), var(--stroop-yellow), var(--stroop-green), var(--stroop-blue));
  }
  .stroop-logo {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    text-align: center;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin-bottom: 4px;
    gap: 0 10px;
  }
  .stroop-logo .c1 { color: var(--stroop-blue); }
  .stroop-logo .c2 { color: var(--stroop-green); }
  .stroop-logo .c3 { color: var(--stroop-yellow); }
  .stroop-logo .c4 { color: var(--stroop-red); }
  .hero {
    text-align: center;
    margin-bottom: 24px;
  }
  .hero h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.2px;
    margin-bottom: 6px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 15px;
    font-weight: 400;
  }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.2px; }
  h2 {
    font-size: 16px;
    font-weight: 600;
    margin-top: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .facts {
    list-style: none;
    padding: 0;
    margin: 14px 0 0;
    display: grid;
    gap: 8px;
  }
  .facts li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
  }
  .icon-svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    color: var(--accent);
  }
  .icon-svg-muted { color: var(--muted); }
  .icon-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
  }
  .icon-circle .icon-svg { width: 28px; height: 28px; }
  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 13px 20px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    margin: 24px 0;
    box-shadow: 0 4px 14px rgba(29, 78, 216, 0.2);
  }
  .cta:hover { background: var(--accent-dark); }
  .cta .icon-svg { color: #fff; width: 16px; height: 16px; }
  .home-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    background: var(--card);
    border: 1px solid var(--border);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .home-link:hover { color: var(--accent-dark); border-color: var(--accent); }
  .home-link .icon-svg { width: 15px; height: 15px; color: inherit; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 24px;
  }
  label {
    display: block;
    font-weight: 500;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .label-icon {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    color: var(--text);
  }
  label.checkbox {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-weight: 400;
  }
  label.checkbox input { margin-top: 3px; }
  input[type="text"], input[type="email"], select {
    display: block;
    width: 100%;
    margin-top: 0;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 400;
    font-family: inherit;
  }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  legend {
    font-weight: 600;
    font-size: 14px;
    padding: 0 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .small {
    font-size: 12.5px;
    color: var(--muted);
  }
  button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  button .icon-svg { color: #fff; width: 16px; height: 16px; }
</style>
